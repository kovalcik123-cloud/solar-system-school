<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Slnečná Sústava 3D (Školská Edícia)</title>
    <link rel="stylesheet" href="learn.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; touch-action: auto; }
        #canvas-container { width: 100vw; height: 100vh; display: block; z-index: 1; }
        
        /* --- LOADER --- */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 2000; transition: opacity 0.8s; }
        .spinner { width: 50px; height: 50px; border: 4px solid #222; border-top: 4px solid #44aadd; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- GATEKEEPER --- */
        #gatekeeper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a2a44 0%, #000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1500;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px;
            border: 1px solid rgba(68, 170, 221, 0.3); backdrop-filter: blur(10px);
            text-align: center; width: 85%; max-width: 350px;
        }
        #gatekeeper input {
            width: 80%; padding: 12px; margin: 20px 0; border-radius: 5px; border: 1px solid #333;
            background: #000; color: #44aadd; text-align: center; font-size: 18px;
        }
        #gatekeeper button {
            padding: 12px 30px; background: #44aadd; border: none; color: white;
            border-radius: 5px; cursor: pointer; text-transform: uppercase; font-weight: bold; width: 100%;
        }

        /* --- PLANET NAVIGATION BAR --- */
        #planet-nav {
            position: fixed; 
            top: 0; left: 0; right: 0; 
            height: calc(60px + env(safe-area-inset-top)); 
            padding-top: env(safe-area-inset-top);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid #44aadd;
            display: flex; align-items: center;
            overflow-x: auto; white-space: nowrap; 
            z-index: 9999; 
            padding-left: 10px; padding-right: 10px; 
            -ms-overflow-style: none; scrollbar-width: none;
            -webkit-overflow-scrolling: touch; touch-action: pan-x;
        }
        #planet-nav::-webkit-scrollbar { display: none; }
        
        .nav-item {
            display: inline-block; padding: 6px 14px; margin: 0 5px;
            border: 1px solid #44aadd; border-radius: 15px;
            color: #44aadd; background: rgba(68, 170, 221, 0.1);
            cursor: pointer; font-size: 12px; font-weight: bold;
            text-transform: uppercase; flex-shrink: 0;
            transition: all 0.2s;
            margin-top: auto; margin-bottom: 15px; 
        }
        .nav-item:active, .nav-item:hover { background: #44aadd; color: white; transform: scale(1.05); }

        /* --- UI OVERLAYS --- */
        #side-ui { 
            position: absolute; 
            top: 160px; 
            left: 20px; 
            display: flex; flex-direction: column; gap: 15px;
            pointer-events: none; z-index: 10; visibility: hidden;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        h1 { margin: 0; font-weight: 300; letter-spacing: 2px; font-size: 24px; color: #fff; }
        .subtitle { margin: 5px 0 0 0; font-size: 14px; color: #aaa; max-width: 300px; line-height: 1.4; }

        .button-group { pointer-events: auto; display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .menu-btn { 
            background: rgba(68, 170, 221, 0.15); border: 1px solid #44aadd; color: #44aadd; 
            padding: 10px 18px; border-radius: 4px; cursor: pointer; text-align: left;
            text-transform: uppercase; letter-spacing: 1px; font-size: 11px; width: fit-content;
        }
        .menu-btn:hover { background: rgba(68, 170, 221, 0.8); color: white; }
        
        #pause-btn.active { background: rgba(255, 170, 0, 0.2); border-color: #ffaa00; color: #ffaa00; }

        /* --- POPUP STYLES (Mobile Default: Centered) --- */
        #quiz-overlay, #info-card {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 320px; background: rgba(10, 20, 35, 0.95); 
            border-radius: 12px; padding: 25px; display: none; backdrop-filter: blur(10px); z-index: 100;
        }
        #quiz-overlay { border: 2px solid #ffaa00; z-index: 200; }
        #info-card { border: 1px solid #44aadd; }
        
        #quiz-question, #quiz-feedback, #quiz-score { text-align: center; }
        #quiz-question { font-size: 18px; margin-bottom: 20px; color: #fff; }
        #quiz-score { color: #44aadd; border-top: 1px solid #333; padding-top: 15px; margin-top: 15px; }
        
        #info-card h2 { margin-top: 0; color: #44aadd; border-bottom: 1px solid #334455; padding-bottom: 10px; margin-bottom: 15px; font-weight: 400; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
        .label { color: #8899aa; } .value { font-weight: bold; color: #fff; }
        .fact-box { margin-top: 20px; padding: 12px; background: rgba(255, 255, 255, 0.05); border-left: 3px solid #44aadd; border-radius: 0 4px 4px 0; font-style: italic; font-size: 0.9rem; line-height: 1.5; color: #ddeeff; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: #556677; transition: color 0.2s; line-height: 1; }

        /* --- DESKTOP/LAPTOP OVERRIDE (Screens wider than 1024px) --- */
        @media (min-width: 1024px) {
            #quiz-overlay {
                /* Reset center positioning */
                top: auto; 
                left: auto;
                transform: none;
                
                /* Move to Top Right */
                top: 100px;
                right: 30px;
                
                /* Optional: Make it slightly wider on desktop */
                width: 300px;
            }
        }

        #results-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center;
            z-index: 1600;
        }
        .results-box {
            background: #1a2a44; border: 2px solid #44aadd; padding: 40px; border-radius: 20px;
            text-align: center; width: 80%; max-width: 400px;
        }
        .grade-text { font-size: 48px; font-weight: bold; color: #ffaa00; margin: 20px 0; }
        /* Phase 2A: navigation shell. The canvas and camera retain their full viewport. */
        #canvas-container { position: fixed; inset: 0; overflow: hidden; }
        :root { --accent: #44aadd; --sidebar-width: 224px; --shell-gap: 20px; }
        button { font: inherit; }
        button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #8bd8ff; outline-offset: 4px; }
        #planet-nav, #side-ui { box-sizing: border-box; background: rgba(8, 19, 34, 0.82); border: 1px solid rgba(139, 192, 221, 0.18); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        #planet-nav {
            top: calc(var(--shell-gap) + env(safe-area-inset-top)); left: calc(var(--sidebar-width) + var(--shell-gap) * 2); right: var(--shell-gap);
            height: 108px; padding: 10px 14px; gap: 8px; border-radius: 22px; z-index: 40;
            justify-content: space-evenly; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #44aadd66 transparent; touch-action: pan-x pinch-zoom;
        }
        #planet-nav::-webkit-scrollbar { display: block; height: 4px; }
        #planet-nav::-webkit-scrollbar-thumb { background: #44aadd66; border-radius: 4px; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
            min-width: 72px; min-height: 80px; max-width: 112px; flex: 1 0 72px; margin: 0; padding: 6px 8px;
            border: 1px solid transparent; border-radius: 16px; background: transparent; color: #dce8f2;
            font-size: 14px; font-weight: 500; text-transform: none; letter-spacing: 0;
            transition: color 160ms ease;
        }
        .nav-item:hover, .nav-item:active { background: rgba(255, 255, 255, 0.06); color: #fff; transform: none; }
        .nav-item:focus-visible { outline: 3px dashed #e8f2fa; outline-offset: 4px; }
        .nav-item[aria-pressed="true"] { background: rgba(68, 170, 221, 0.14); border-color: rgba(68, 170, 221, 0.65); color: #8bd8ff; }
        .planet-thumbnail {
            width: 44px; height: 44px; border-radius: 50%; background-size: auto 100%; background-position: center;
            box-shadow: inset -10px -4px 12px rgba(0, 0, 0, 0.7), inset 3px 2px 5px rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.15); pointer-events: none;
        }
        .nav-item[aria-pressed="true"] .planet-thumbnail { outline: 2px solid var(--accent); outline-offset: 3px; }
        #side-ui {
            position: fixed; top: calc(var(--shell-gap) + env(safe-area-inset-top)); bottom: calc(var(--shell-gap) + env(safe-area-inset-bottom));
            left: var(--shell-gap); width: var(--sidebar-width); padding: 26px 18px 18px; border-radius: 24px;
            gap: 0; pointer-events: auto; text-shadow: none; z-index: 30; overflow-y: auto; touch-action: pan-y pinch-zoom;
        }
        body.is-ready #side-ui { visibility: visible !important; }
        .app-brand h1 { font-size: 27px; font-weight: 600; line-height: 1.2; letter-spacing: -0.7px; }
        .app-brand h1 span { color: #73c7ef; white-space: nowrap; }
        .app-brand .subtitle { color: #b4c5d6; font-size: 14px; line-height: 1.5; margin-top: 12px; }
        .app-navigation { display: flex; flex-direction: column; gap: 10px; margin-top: 36px; }
        .app-link {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 12px;
            border: 1px solid transparent; border-radius: 14px; background: transparent; color: #dce8f2;
            text-align: left; cursor: pointer; transition: background 160ms ease, border-color 160ms ease;
        }
        .app-link svg { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .app-link strong { display: block; font-size: 16px; font-weight: 600; }
        .app-link small { display: block; color: #a8bacd; font-size: 12px; margin-top: 3px; }
        .app-link:hover:not(:disabled) { background: rgba(68, 170, 221, 0.08); }
        .app-link[aria-current="page"] { color: #8bd8ff; background: rgba(68, 170, 221, 0.13); border-color: rgba(68, 170, 221, 0.35); }
        .app-link:disabled { color: #96a6ba; cursor: not-allowed; }
        .simulation-controls { margin-top: auto; padding-top: 28px; }
        .simulation-controls .button-group { margin-top: 0; }
        .simulation-controls .menu-btn { width: 100%; min-height: 44px; font-size: 12px; letter-spacing: 0.3px; }
        .interaction-hint { color: #a8bacd; font-size: 12px; line-height: 1.7; margin: 16px 0 0; }
        .process-brand { color: #b4c5d6; font-size: 12px; letter-spacing: 0.5px; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(139, 192, 221, 0.15); }
        .process-brand span { color: #73c7ef; }
        body.is-quiz .simulation-controls { visibility: hidden; }
        body.is-comparison .simulation-controls { visibility: hidden; }
        body.is-light-stage .simulation-controls { visibility: hidden; }
        /* Phase 6H.8.C: the desktop Learn catalogue uses the space of the simulation controls (hidden and not focusable while it is open). */
        @media (min-width: 1200px) { body:has(#learn-root.learn-home:not([hidden])) .simulation-controls { visibility: hidden; } }
        #quiz-overlay, #info-card { box-sizing: border-box; width: min(370px, calc(100% - 24px)); max-width: 370px; max-height: calc(100dvh - 180px); overflow-y: auto; touch-action: pan-y pinch-zoom; }
        #quiz-overlay button, #results-screen button { min-height: 44px; }
        #results-screen { box-sizing: border-box; padding: 12px; }
        .results-box { box-sizing: border-box; width: min(480px, 100%); max-height: calc(100dvh - 24px); overflow-y: auto; }
        @media (min-width: 1024px) { #quiz-overlay { top: 148px; right: 24px; } }
        @media (max-width: 1199px) and (min-width: 701px) {
            :root { --sidebar-width: 160px; --shell-gap: 12px; }
            #side-ui { padding: 22px 12px 16px; border-radius: 20px; }
            .app-brand h1 { font-size: 22px; }
            .app-brand .subtitle { font-size: 12px; }
            .app-link { gap: 8px; padding: 10px 8px; }
            .app-link strong { font-size: 14px; }
            .app-link small { font-size: 11px; }
            #planet-nav { height: 100px; padding: 8px; gap: 3px; }
            .nav-item { min-width: 64px; flex-basis: 64px; padding: 6px 3px; font-size: 13px; }
            .planet-thumbnail { width: 40px; height: 40px; }
            .interaction-hint { font-size: 11px; }
        }
        @media (max-width: 700px) {
            :root { --shell-gap: 12px; }
            #planet-nav { top: calc(56px + env(safe-area-inset-top)); left: 12px; right: 12px; height: 92px; padding: 6px; gap: 4px; justify-content: flex-start; border-radius: 18px; }
            .nav-item { min-width: 62px; flex: 0 0 62px; min-height: 72px; padding: 5px 2px; font-size: 12px; }
            .planet-thumbnail { width: 36px; height: 36px; }
            #side-ui { top: auto; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; right: 12px; width: auto; height: 76px; padding: 6px; overflow: visible; border-radius: 18px; backdrop-filter: none; -webkit-backdrop-filter: none; }
            .app-brand { position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 16px; pointer-events: none; }
            .app-brand h1 { font-size: 19px; letter-spacing: -0.4px; }
            .app-brand h1 br { display: none; }
            .app-brand .subtitle { display: none; }
            .app-navigation { flex-direction: row; margin: 0; gap: 4px; }
            .app-link { flex: 1; justify-content: center; gap: 5px; min-height: 62px; padding: 8px 4px; border-radius: 12px; }
            .app-link svg { width: 20px; height: 20px; }
            .app-link strong { font-size: 13px; }
            .app-link small { font-size: 10px; }
            .simulation-controls { position: fixed; bottom: calc(98px + env(safe-area-inset-bottom)); left: 12px; right: 12px; padding: 0; }
            .simulation-controls .button-group { flex-direction: row; gap: 8px; }
            .simulation-controls .menu-btn { flex: 1; width: 0; padding: 8px; font-size: 11px; text-align: center; background: rgba(8, 19, 34, 0.9); }
            .interaction-hint { display: none; }
            .process-brand { position: fixed; top: calc(21px + env(safe-area-inset-top)); right: 16px; padding: 0; border: 0; margin: 0; font-size: 10px; }
            #quiz-overlay, #info-card { max-height: calc(100dvh - 268px); }
        }
        @media (prefers-reduced-motion: reduce) { .nav-item, .app-link { transition: none; } }
        /* Phase 2B: nonmodal planet information, independent of the 3D camera. */
        #info-card {
            --info-limit: calc(100dvh - 168px);
            top: 148px; right: var(--shell-gap); bottom: auto; left: auto; transform: none;
            width: 350px; max-width: 380px; max-height: var(--info-limit); padding: 0; overflow: hidden;
            background: rgba(8, 19, 34, 0.88); border: 1px solid rgba(139, 192, 221, 0.24); border-radius: 22px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22); animation: info-panel-enter 200ms ease-out;
        }
        .info-header { display: flex; align-items: center; gap: 12px; min-height: 88px; box-sizing: border-box; padding: 18px 20px; }
        .info-thumbnail { width: 46px; height: 46px; flex-shrink: 0; }
        .info-heading { min-width: 0; }
        #info-card h2 { color: #e8f2fa; font-size: 24px; font-weight: 600; line-height: 1.2; border: 0; padding: 0; margin: 0; }
        .info-heading p { color: #a8bacd; font-size: 12px; margin: 5px 0 0; }
        #info-card .close-btn {
            position: static; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            width: 44px; height: 44px; margin-left: auto; padding: 0; border: 1px solid transparent;
            border-radius: 12px; background: transparent; color: #b4c5d6; cursor: pointer;
            transition: background 160ms ease, color 160ms ease;
        }
        #info-card .close-btn:hover { background: rgba(68, 170, 221, 0.1); color: #8bd8ff; }
        #info-card .close-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
        .info-content { box-sizing: border-box; max-height: calc(var(--info-limit) - 90px); padding: 0 22px 22px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #44aadd66 transparent; }
        .planet-details { margin: 0; }
        #info-card .data-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; margin: 0; padding: 14px 0; border-bottom: 1px solid rgba(139, 192, 221, 0.1); font-size: 14px; line-height: 1.4; }
        #info-card .label { color: #b4c5d6; }
        #info-card .value { color: #e8f2fa; font-size: 15px; font-weight: 600; margin: 0; text-align: right; }
        #info-card .fact-box { margin-top: 20px; padding: 16px; background: rgba(68, 170, 221, 0.07); border: 1px solid rgba(68, 170, 221, 0.16); border-radius: 14px; font-style: normal; font-size: 14px; line-height: 1.6; color: #dce8f2; }
        .fact-heading { display: block; color: #8bd8ff; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; margin-bottom: 8px; }
        #planet-fact { margin: 0; }
        @keyframes info-panel-enter { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes info-sheet-enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 1600px) { #info-card { width: 380px; } }
        @media (max-width: 1199px) and (min-width: 701px) {
            #info-card { --info-limit: calc(100dvh - 140px); top: 128px; right: 12px; width: 320px; }
            .info-content { padding: 0 18px 18px; }
        }
        @media (max-width: 700px) {
            #info-card {
                --info-limit: min(410px, calc(100dvh - 326px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
                top: auto; right: 12px; left: 12px; bottom: calc(154px + env(safe-area-inset-bottom));
                width: auto; max-width: none; border-radius: 20px; animation-name: info-sheet-enter;
            }
            .info-header { padding: 16px 18px; }
            .info-content { padding: 0 18px 18px; }
            #info-card h2 { font-size: 22px; }
            #info-card .data-row { padding: 12px 0; }
            #info-card .fact-box { padding: 14px; margin-top: 16px; }
        }
        @media (prefers-reduced-motion: reduce) { #info-card { animation: none; } #info-card .close-btn { transition: none; } }
        /* Phase 2C: floating simulation controls and compact mobile information. */
        .process-brand { margin-top: auto; }
        .simulation-controls {
            position: fixed; left: calc(50% + var(--sidebar-width) / 2); bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateX(-50%); z-index: 40; margin: 0; padding: 10px; display: flex; align-items: center; gap: 12px;
            width: max-content; max-width: calc(100% - var(--sidebar-width) - 64px); box-sizing: border-box;
            border: 1px solid rgba(139,192,221,.24); border-radius: 20px; background: rgba(8,19,34,.88);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        body:not(.is-ready) .simulation-controls { visibility: hidden; }
        .simulation-button { min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 10px 14px; border: 1px solid rgba(139,192,221,.2); border-radius: 13px; color: #dce8f2; background: rgba(255,255,255,.03); cursor: pointer; font-size: 14px; }
        .simulation-button:hover { background: rgba(255,255,255,.08); }
        .simulation-button svg { width: 22px; height: 22px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .play-button { color: #8bd8ff; border-color: rgba(68,170,221,.45); background: rgba(68,170,221,.13); min-width: 136px; }
        #orbit-visibility[aria-pressed="true"] { color: #8bd8ff; border-color: rgba(68,170,221,.4); }
        .speed-control { display: flex; align-items: center; gap: 10px; color: #b4c5d6; font-size: 12px; }
        .speed-control select { min-height: 48px; width: 74px; padding: 8px; border-radius: 12px; border: 1px solid rgba(139,192,221,.3); background: #102437; color: #e8f2fa; font: inherit; font-size: 15px; cursor: pointer; }
        .speed-control select:focus-visible { outline: 3px solid #8bd8ff; outline-offset: 4px; }
        #info-expand, .mobile-info-caption { display: none; }
        #info-card { --info-limit: calc(100dvh - 264px); }
        @media (max-width: 1199px) and (min-width: 701px) {
            #info-card { --info-limit: calc(100dvh - 244px); }
            .simulation-controls { gap: 8px; }
            .simulation-button { padding: 10px; font-size: 13px; }
            .speed-control { gap: 6px; }
        }
        @media (max-width: 700px) {
            .simulation-controls { left: 12px; right: 12px; bottom: calc(98px + env(safe-area-inset-bottom)); transform: none; width: auto; max-width: none; height: 110px; padding: 8px; gap: 6px; display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; }

            .speed-control { justify-content: center; gap: 6px; font-size: 11px; }
            .speed-control select { min-height: 44px; width: 68px; }
            #info-card { --info-limit: min(410px, calc(100dvh - 380px - env(safe-area-inset-top) - env(safe-area-inset-bottom))); bottom: calc(220px + env(safe-area-inset-bottom)); }
            #info-card:not(.mobile-expanded) .info-content { display: none; }
            #info-expand { display: block; min-width: 48px; min-height: 44px; padding: 6px; border: 1px solid rgba(68,170,221,.35); border-radius: 12px; background: rgba(68,170,221,.1); color: #8bd8ff; font: inherit; font-size: 12px; cursor: pointer; }
            .info-header { gap: 8px; padding: 12px; }
            .info-heading p { font-size: 10px; }
            .desktop-info-caption { display: none; }

        function generateOrganicTexture(data) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const baseCol = '#' + (data.color || 0x888888).toString(16).padStart(6, '0');
            ctx.fillStyle = baseCol; ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 8; i++) {
                const opacity = Math.random() * 0.15;
                const brightness = (Math.random() - 0.5) * 60;
                const layerCol = adjustColor(baseCol, brightness);
                ctx.fillStyle = layerCol; ctx.globalAlpha = opacity;
                for (let j = 0; j < 20; j++) {
                    const x = Math.random() * 512; const y = Math.random() * 512;
                    const rx = 80 + Math.random() * 250; const ry = 15 + Math.random() * 50;
                    ctx.beginPath(); ctx.ellipse(x, y, rx, rx/2.5, Math.random() * Math.PI, 0, Math.PI * 2); ctx.fill();
                }
            }
            ctx.globalAlpha = 1.0;
            const tex = new THREE.CanvasTexture(canvas);
            tex.encoding = THREE.sRGBEncoding;
            return tex;
        }

        function adjustColor(color, amount) {
            let col = parseInt(color.replace('#',''), 16);
            let r = (col >> 16) + amount; let g = ((col >> 8) & 0x00FF) + amount; let b = (col & 0x0000FF) + amount;
            r = Math.min(255, Math.max(0, r)); g = Math.min(255, Math.max(0, g)); b = Math.min(255, Math.max(0, b));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function createSaturnRingTexture() {
            // Radii are in Saturn radii, fitted inside the existing 4.5-radius plane.
            // C/B/A regions and the Cassini gap are illustrative, not an exact simulation.
            const size = 1024, profileSize = 4096, halfExtent = 2.25;
            const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d'), image = ctx.createImageData(size, size);
            const profile = new Uint8ClampedArray(profileSize * 4);
            const ramp = (a, b, x) => THREE.MathUtils.smoothstep(x, a, b);
            for (let i = 0; i < profileSize; i++) {
                const r = i / (profileSize - 1) * halfExtent;
                if (r < 1.24 || r > 2.20) continue;
                const variation = 0.55 * Math.sin(r * 90) + 0.30 * Math.sin(r * 250) + 0.15 * Math.sin(r * 620);
                let color, opacity;
                if (r < 1.50) { color = [150, 140, 125]; opacity = 0.25 + 0.06 * variation; }
                else if (r < 1.90) { color = [198, 185, 163]; opacity = 0.88 + 0.035 * variation; }
                else if (r < 1.975) continue; // Narrow, transparent Cassini Division.
                else { color = [178, 169, 151]; opacity = 0.70 + 0.04 * variation; }
                const edge = ramp(1.24, 1.247, r) * (1 - ramp(2.193, 2.20, r));
                const gapEdge = r < 1.90 ? 1 - ramp(1.894, 1.90, r) : ramp(1.975, 1.981, r);
                for (let c = 0; c < 3; c++) profile[i * 4 + c] = color[c] + variation * 5;
                profile[i * 4 + 3] = opacity * edge * gapEdge * 255;
            }
            for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
                const dx = (x + 0.5 - size / 2) / (size / 2), dy = (y + 0.5 - size / 2) / (size / 2);
                const sample = Math.floor(Math.sqrt(dx * dx + dy * dy) * (profileSize - 1));
                if (sample >= profileSize) continue;
                const offset = (y * size + x) * 4;
                for (let c = 0; c < 4; c++) image.data[offset + c] = profile[sample * 4 + c];
            }
            ctx.putImageData(image, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 4);
            return texture;
        }

        function createSaturnRingMaterial(radius) {
            const material = new THREE.MeshBasicMaterial({
                map: createSaturnRingTexture(), side: THREE.DoubleSide,
                transparent: true, depthWrite: false, alphaTest: 0.015
            });
            material.onBeforeCompile = shader => {
                shader.uniforms.ringPlanetRadius = { value: radius };
                const varyings = 'varying vec3 vRingPosition; varying vec3 vRingCenter; varying vec3 vRingNormal;\n';
                shader.vertexShader = varyings + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace('#include <fog_vertex>', `
                    vRingPosition = (modelMatrix * vec4(transformed, 1.0)).xyz;
                    vRingCenter = modelMatrix[3].xyz;
                    vRingNormal = normalize(mat3(modelMatrix) * vec3(0.0, 0.0, 1.0));
                    #include <fog_vertex>
                `);
                shader.fragmentShader = 'uniform float ringPlanetRadius;\n' + varyings + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace('#include <tonemapping_fragment>', `
                    vec3 sunlight = normalize(-vRingPosition); // Existing Sun is at the origin.
                    vec3 relativePosition = vRingPosition - vRingCenter;
                    float alongRay = dot(relativePosition, sunlight);
                    float rayDistance = length(relativePosition - alongRay * sunlight);
                    float shadow = (1.0 - smoothstep(ringPlanetRadius * 0.96, ringPlanetRadius * 1.04, rayDistance)) * (1.0 - step(0.0, alongRay));
                    float illumination = 0.30 + 0.55 * sqrt(abs(dot(normalize(vRingNormal), sunlight)));
                    gl_FragColor.rgb *= illumination * mix(1.0, 0.24, shadow);
                    #include <tonemapping_fragment>
                `);
            };
            material.customProgramCacheKey = () => 'saturn-rings-sunlight-v1';
            return material;
        }

        function createSunGlow() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); 
            gradient.addColorStop(0.2, 'rgba(255, 200, 50, 0.6)'); 
            gradient.addColorStop(0.5, 'rgba(255, 150, 0, 0.2)'); 
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0,0,64,64);
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: new THREE.CanvasTexture(canvas), 
                color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false 
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(130, 130, 1); 
            return sprite;
        }

        function createUniverse() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 4000; i++) vertices.push(THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000), THREE.MathUtils.randFloatSpread(2000));
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;

            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)'); gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, 32, 32);
            
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 3.5, map: new THREE.CanvasTexture(canvas), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 });
            const stars = new THREE.Points(geometry, starMaterial);
            scene.add(stars);

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(
                'stars.jpg',  
                function(texture) {
                    texture.encoding = THREE.sRGBEncoding;
                    addGalaxySphere(texture);

                undefined,

        function addGalaxySphere(texture) {
            const geometry = new THREE.SphereGeometry(5000, 60, 40);
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, side: THREE.BackSide, depthWrite: false, fog: false 
            });
            const starSphere = new THREE.Mesh(geometry, material);
            scene.add(starSphere);
        }

        function applyGasGiantSurfaceCorrection(material) {
            material.roughness = 1;
            material.metalness = 0;
            material.onBeforeCompile = shader => {
                // Three.js r128: compress accumulated linear light before fog and sRGB output.
                // Local to Jupiter/Saturn; the renderer remains on NoToneMapping.
                shader.fragmentShader = shader.fragmentShader.replace(/vec3 outgoingLight =[^;]+;/, lightingSum => `${lightingSum}
                    outgoingLight *= 0.35;
                    outgoingLight = outgoingLight / (vec3(1.0) + outgoingLight);
                `);
            };
            material.customProgramCacheKey = () => 'gas-giant-surface-c4-v1';
        }

        const planetSurfaceCorrections = {
            'Merkúr': { gain: 0.52, shoulder: 0.80 },
            'Venuša': { gain: 0.45, shoulder: 1.00 },
            'Mars': { gain: 0.60, shoulder: 0.70 },
            'Urán': { gain: 0.48, shoulder: 1.00 },
            'Neptún': { gain: 0.80, shoulder: 0.85 }
        };

        function applyPlanetSurfaceCorrection(material, parameters) {
            material.roughness = 1;
            material.metalness = 0;
            material.onBeforeCompile = shader => {
                if (!material.map) return; // Reuse the stock shader while the texture loads.
                shader.uniforms.surfaceGain = { value: parameters.gain };
                shader.uniforms.surfaceShoulder = { value: parameters.shoulder };
                shader.fragmentShader = 'uniform float surfaceGain; uniform float surfaceShoulder;\n' + shader.fragmentShader;
                // Accumulated linear light, before fog and sRGB output. No global tone mapping.
                shader.fragmentShader = shader.fragmentShader.replace(/vec3 outgoingLight =[^;]+;/, lightingSum => `${lightingSum}
                    outgoingLight *= surfaceGain;
                    outgoingLight /= vec3(1.0) + surfaceShoulder * outgoingLight;
                `);
            };
            // Parameters are uniforms: all five planets share this shader variant.
            material.customProgramCacheKey = () => material.map
                ? 'planet-surface-linear-v1' : THREE.Material.prototype.onBeforeCompile.toString();
        }

        // Earth-only rendering; sunlight follows the existing Sun at the origin.
        function createEarthMaterial(data, textureLoader, maxAnisotropy) {
            const black = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1, THREE.RGBAFormat);
            black.needsUpdate = true;
            const vertexShader = `
                varying vec2 vUv;
                varying vec3 vWorldPosition;
                varying vec3 vWorldNormal;
                void main() {
                    vUv = uv;
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    vWorldNormal = normalize(mat3(modelMatrix) * normal);
                    gl_Position = projectionMatrix * viewMatrix * worldPosition;
                }
            `;
            const material = new THREE.ShaderMaterial({
                uniforms: { dayMap: { value: black }, nightMap: { value: black } },
                vertexShader,
                fragmentShader: `
                    uniform sampler2D dayMap;
                    uniform sampler2D nightMap;
                    varying vec2 vUv;
                    varying vec3 vWorldPosition;
                    varying vec3 vWorldNormal;
                    void main() {
                        float sunlight = dot(normalize(vWorldNormal), normalize(-vWorldPosition));
                        vec3 day = pow(texture2D(dayMap, vUv).rgb, vec3(2.2));
                        vec3 cities = pow(texture2D(nightMap, vUv).rgb, vec3(2.2));
                        float night = 1.0 - smoothstep(-0.18, 0.08, sunlight);
                        vec3 color = day * (0.018 + 1.15 * max(sunlight, 0.0));
                        color += cities * night * 0.75;
                        gl_FragColor = vec4(color, 1.0);
                        #include <tonemapping_fragment>
                        #include <encodings_fragment>
                    }
                `
            });
            const loadDay = (path, fallback) => textureLoader.load(path, texture => {
                texture.anisotropy = Math.min(maxAnisotropy, 4);
                material.uniforms.dayMap.value = texture;
            }, undefined, fallback);
            loadDay('2k_earth_daymap.jpg', () => loadDay(data.texture, () => {
                material.uniforms.dayMap.value = generateOrganicTexture(data);
            }));
            textureLoader.load('2k_earth_nightmap.jpg', texture => {
                material.uniforms.nightMap.value = texture;
            }, undefined, () => {}); // Black default gracefully disables unavailable city lights.
            material.userData.earthVertexShader = vertexShader;
            return material;
        }

        function addEarthLayers(earth, textureLoader, maxAnisotropy) {
            const vertexShader = earth.material.userData.earthVertexShader;
            const cloudMaterial = new THREE.ShaderMaterial({
                uniforms: { cloudMap: { value: null } },
                vertexShader,
                transparent: true,
                depthWrite: false,
                fragmentShader: `
                    uniform sampler2D cloudMap;
                    varying vec2 vUv;
                    varying vec3 vWorldPosition;
                    varying vec3 vWorldNormal;
                    void main() {
                        float density = texture2D(cloudMap, vUv).r;
                        float alpha = smoothstep(0.08, 0.85, density) * 0.82;
                        float sunlight = dot(normalize(vWorldNormal), normalize(-vWorldPosition));
                        gl_FragColor = vec4(vec3(0.025 + max(sunlight, 0.0)), alpha);
                        #include <tonemapping_fragment>
                        #include <encodings_fragment>
                    }
                `
            });
            const clouds = new THREE.Mesh(new THREE.SphereGeometry(earth.userData.radius * 1.008, 48, 32), cloudMaterial);
            clouds.name = 'earth-clouds';
            clouds.visible = false;
            earth.add(clouds);
            textureLoader.load('2k_earth_clouds.jpg', texture => {
                texture.anisotropy = Math.min(maxAnisotropy, 4);
                cloudMaterial.uniforms.cloudMap.value = texture;
                clouds.visible = true;
            }, undefined, () => {}); // Missing clouds leave the surface unobstructed.

            const atmosphere = new THREE.Mesh(
                new THREE.SphereGeometry(earth.userData.radius * 1.025, 48, 32),
                new THREE.ShaderMaterial({
                    vertexShader,
                    side: THREE.BackSide,
                    transparent: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    fragmentShader: `
                        varying vec3 vWorldPosition;
                        varying vec3 vWorldNormal;
                        void main() {
                            vec3 normal = normalize(vWorldNormal);
                            vec3 viewDirection = normalize(cameraPosition - vWorldPosition);
                            float rim = pow(1.0 - abs(dot(normal, viewDirection)), 3.0);
                            float sunlight = dot(normal, normalize(-vWorldPosition));
                            float day = smoothstep(-0.25, 0.35, sunlight);
                            gl_FragColor = vec4(0.12, 0.38, 0.75, rim * (0.015 + 0.24 * day));
                            #include <tonemapping_fragment>
                            #include <encodings_fragment>
                        }
                    `
                })
            );
            atmosphere.name = 'earth-atmosphere';
            earth.add(atmosphere);
            clouds.renderOrder = 1;
            atmosphere.renderOrder = 2;
        }

        function createSolarSystem() {
            const textureLoader = new THREE.TextureLoader();
            const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
            
            planetData.forEach(data => {
                // OPTIMIZATION: Reduced segments from 128 to 64 to lower GPU load
                const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
                let material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, metalness: 0.05 });
                if (data.name === "Jupiter" || data.name === "Saturn") applyGasGiantSurfaceCorrection(material);
                if (planetSurfaceCorrections[data.name]) applyPlanetSurfaceCorrection(material, planetSurfaceCorrections[data.name]);
                const onTexError = () => { material.map = generateOrganicTexture(data); material.needsUpdate = true; };
                
                if (data.name === "Zem") {
                    material.dispose();
                    material = createEarthMaterial(data, textureLoader, maxAnisotropy);
                } else {
                    const tex = textureLoader.load(data.texture, (t) => {
                        t.encoding = THREE.sRGBEncoding; t.anisotropy = maxAnisotropy; material.map = t; material.needsUpdate = true;
                    }, undefined, onTexError);

                    if (data.name === "Slnko") { material = new THREE.MeshBasicMaterial({ color: 0xffffff, map: tex }); }

                }

                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { ...data, angle: Math.random() * Math.PI * 2 };
                if (data.name === "Zem") addEarthLayers(mesh, textureLoader, maxAnisotropy);
                
                if (data.distance3D === 0) {
                     mesh.position.set(0,0,0);
                } else {
                    mesh.position.x = Math.cos(mesh.userData.angle) * data.distance3D;
                    mesh.position.z = Math.sin(mesh.userData.angle) * data.distance3D;
                }

                scene.add(mesh);
                planets.push(mesh);

                // SATELLITES (MOONS) LOGIC
                if (data.moons) {
                    data.moons.forEach(moonData => {
                        const mGeo = new THREE.SphereGeometry(moonData.radius, 32, 32);
                        let mMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
                        // Load moon texture
                        textureLoader.load(moonData.texture, (t) => { 
                            t.encoding = THREE.sRGBEncoding; mMat.map = t; mMat.needsUpdate = true;
                        }, undefined, () => { mMat.map = generateOrganicTexture({color: 0x888888}); mMat.needsUpdate = true; });

                        const moonMesh = new THREE.Mesh(mGeo, mMat);
                        moonMesh.userData = { 
                            ...moonData, 
                            angle: Math.random() * Math.PI * 2,
                            parent: mesh,
                            rotationModel: moonData.rotationModel || "independent"
                        };
                        if (moonMesh.userData.rotationModel === "tidallyLocked") orientLockedSatellite(moonMesh);
                        scene.add(moonMesh);
                        satellites.push(moonMesh);
                    });
                }

                if (data.hasRings) {
                    const ringGeo = new THREE.PlaneGeometry(data.radius * 4.5, data.radius * 4.5);
                    const ringMat = createSaturnRingMaterial(data.radius);
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = -Math.PI / 2.5; mesh.add(ring);
                }

                if (data.distance3D > 0) {
                    const orbitCurve = new THREE.EllipseCurve(0, 0, data.distance3D, data.distance3D, 0, 2 * Math.PI, false, 0);
                    const orbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitCurve.getPoints(128)), new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.3 }));
                    orbitLine.rotation.x = Math.PI / 2;
                    scene.add(orbitLine);
                    orbitLines.push(orbitLine);
                }
            });
        }

        // SphereGeometry UV center is local +X. A fixed phase keeps this texture
        // hemisphere Earth-facing across reloads; geographic near-side alignment is unverified.
        function orientLockedSatellite(moon) {
            moon.rotation.y = Math.PI - moon.userData.angle + moon.userData.texturePhaseOffset;
        }

        function toggleOrbit() {
            areOrbitsActive = !areOrbitsActive;

        function syncSimulationControls() {

        const mobileInfoLayout = window.matchMedia('(max-width: 700px)');
        function syncInfoSheet() {

        function animate() {
            requestAnimationFrame(animate);

            // --- FPS CAP LOGIC ---
            // If the PC is trying to run at 144Hz, this forces it to wait
            const now = performance.now();
            const elapsed = now - lastFrameTime;
            if (elapsed < interval) return; // Skip frame if too fast

            // Correct for drift
            lastFrameTime = now - (elapsed % interval);
            
            // --- DELTA TIME LOGIC ---
            let delta = clock.getDelta();
            if (delta > 0.1) delta = 0.1; // Cap delta to prevent massive jumps during lags

            // Advance only astronomical motion. Keep sampling the clock while paused so
            // rendering, camera controls and UI timers continue without a resume-time jump.
            const motionActive = areOrbitsActive && !isQuizMode && !isQuizResults && !earthLessonExperiment.active && !moonPhaseExperiment.active;
            const motionDelta = motionActive ? delta : 0;

            // PLANETS
            planets.forEach(mesh => {
                const data = mesh.userData;
                const spinSpeed = data.name === "Slnko" ? 0.002 : 0.004;
                mesh.rotation.y += data.name === "Zem"
                    ? EARTH_SPIN_RATE * motionDelta * simulationSpeed
                    : spinSpeed * motionDelta * 60;
                if (data.name === "Zem") {
                    // Relative drift adds slow independent rotation to the cloud layer.
                    const clouds = mesh.getObjectByName('earth-clouds');
                    clouds.rotation.y += EARTH_CLOUD_DRIFT_RATE * motionDelta * simulationSpeed;
                }

                if (motionActive && data.distance3D > 0) {
                    mesh.userData.angle -= orbitalAngularSpeed(data) * delta;
                    mesh.position.x = Math.cos(mesh.userData.angle) * data.distance3D;
                    mesh.position.z = Math.sin(mesh.userData.angle) * data.distance3D;
                }
            });

            // SATELLITES (MOONS)
            satellites.forEach(moon => {
                const data = moon.userData;
                const parent = data.parent;
                
                if (data.rotationModel === "independent") moon.rotation.y += 0.01 * motionDelta * 60;

                if (motionActive) {
                    data.angle -= orbitalAngularSpeed(data) * delta;
                }
                
                moon.position.x = parent.position.x + Math.cos(data.angle) * data.distance;
                moon.position.z = parent.position.z + Math.sin(data.angle) * data.distance;
                moon.position.y = parent.position.y; 
                if (data.rotationModel === "tidallyLocked") orientLockedSatellite(moon);
            });
            
            updateCameraMotion(now);
            const minimum = controls.minDistance, maximum = controls.maxDistance;
            if (cameraTransition) { controls.minDistance = 0; controls.maxDistance = Infinity; }
            controls.update();
            controls.minDistance = minimum; controls.maxDistance = maximum;
            earthLessonExperiment.update(now);
            moonPhaseExperiment.update(now);
            earthMoonView.update();
            comparisonStage.update(); lightStage.update();
            if (!comparisonStage.render() && !lightStage.render()) renderer.render(scene, camera);
            planetLabels.update(now);
        }

        const planetLabels = (() => {

            }
            function hide() { requested = false; hideLayer(); }
            function sync() { if (!eligible()) hideLayer(); }

                entries.forEach(entry => { entry.priority = null; });
            }
            function init() {

                    const button = document.createElement('button');

            function measure() {
                // Read dimensions together only after layout/font/UI changes, never for tracking.
                const canvas = renderer.domElement.getBoundingClientRect();
                const boxes = ui.map(element => element.getBoundingClientRect());
                const mobile = mobileInfoLayout.matches;
                layout = { canvas, left: mobile ? 12 : boxes[0].right + 20, right: canvas.right - 16, top: boxes[1].bottom + 12, bottom: boxes[3].top - 16,
                    obstacles: boxes.filter(box => box.width && box.height).map(b => ({ x: b.left, y: b.top, w: b.width, h: b.height })), mobile };

            }
            const overlaps = (a, b, gap = 8) => a.x < b.x + b.w + gap && a.x + a.w + gap > b.x && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;
            function candidate(entry, slot) {
                const b = entry.body, w = entry.width, h = entry.height, r = b.radius + 10;
                const box = entry.box;
                box.w = w; box.h = h;
                if (slot === 0) { box.x = b.x + r; box.y = b.y - h / 2; }
                else if (slot === 1) { box.x = b.x - r - w; box.y = b.y - h / 2; }
                else if (slot === 2) { box.x = b.x - w / 2; box.y = b.y - r - h; }

                if (dirty) measure();
                const c = layout.canvas, focal = c.height * camera.projectionMatrix.elements[5] / 2;
                entries.forEach(entry => {
                    world.setFromMatrixPosition(entry.mesh.matrixWorld); view.copy(world).applyMatrix4(camera.matrixWorldInverse); projected.copy(world).project(camera);
                    const depth = -view.z, radius = focusRadius(entry.mesh), disk = entry.mesh.userData.radius;
                    const b = entry.body;
                    b.x = c.left + (projected.x + 1) * c.width / 2; b.y = c.top + (1 - projected.y) * c.height / 2; b.depth = depth;

            function configure(next = {}) {

                const far = journey === 'fifteen', solar = journey === 'planets', em = journey === 'earth-moon';
                stage.fifteen.visible = far; stage.moon.visible = em; stage.rings.moon.visible = em; stage.route.visible = em; stage.labels.moon.hidden = !em;
                stage.earth.visible = !solar; stage.labels.earth.hidden = solar; stage.solar.visible = solar;
